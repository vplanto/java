# Jekyll Configuration for VARTA Java Course
# Using Rouge for syntax highlighting
markdown: kramdown
highlighter: rouge

# Basic site metadata
title: "ONU Java Course"
description: "Educational materials for Java Programming at ONU"

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "default"

# Exclude some things
exclude:
  - Gemfile
  - Gemfile.lock
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .idea
  - out
  - 02_semester/exam_answers.md
